;
; Netatalk 3.x configuration file
;

[Global]
hostname = thinkserver.local
afp interfaces = em0 em1
afp listen = 192.168.1.0/24
cnid listen = 127.0.0.1
vol preset = default_for_all
log file = /var/log/netatalk.log
log level = default:warn
disconnect time = 1
;vol dbpath = /var/netatalk/CNID/$u/$v/

[default_for_all]
file perm = 0640
directory perm = 0750
cnid scheme = dbd

; [Homes]
;basedir regex = /home/james
; 128 GB (units of MB)
;vol size limit = 128000

[TimeMachine on xxx]
time machine = yes
path=/media/storage/timemachine/$u
valid users = @timemachine
; 128 GB (units of MB)
vol size limit = 128000
